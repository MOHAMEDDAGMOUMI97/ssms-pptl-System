<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="ceoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="deptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="npiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="22" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">Organizational Structure — ECI Tangier</text>

  <!-- CEO / Managing Director -->
  <g transform="translate(425, 35)" filter="url(#shadow)">
    <rect width="250" height="60" rx="8" fill="url(#ceoGrad)" />
    <text x="125" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">SAHAB Said</text>
    <text x="125" y="46" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">MD / Country Director</text>
  </g>

  <!-- Connecting lines from CEO to departments -->
  <path d="M 550 95 L 550 115 M 65 115 L 1035 115" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 65 115 L 65 135 M 205 115 L 205 135 M 345 115 L 345 135 M 485 115 L 485 135 M 625 115 L 625 135 M 765 115 L 765 135 M 905 115 L 905 135 M 1035 115 L 1035 135" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- Department Level 1: 8 departments -->
  <!-- Quality Manager -->
  <g transform="translate(10, 135)" filter="url(#shadow)">
    <rect width="110" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="55" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Quality</text>
    <text x="55" y="36" fill="#cbd5e1" font-size="10" text-anchor="middle">Manager</text>
  </g>

  <!-- Operations & Maintenance Manager -->
  <g transform="translate(130, 135)" filter="url(#shadow)">
    <rect width="150" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="75" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Operations &amp;</text>
    <text x="75" y="33" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Maintenance</text>
    <text x="75" y="46" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Manager</text>
  </g>

  <!-- Supply Chain Manager -->
  <g transform="translate(290, 135)" filter="url(#shadow)">
    <rect width="110" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="55" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Supply Chain</text>
    <text x="55" y="36" fill="#cbd5e1" font-size="10" text-anchor="middle">Manager</text>
  </g>

  <!-- Engineering Manager (highlighted — PFE site) -->
  <g transform="translate(410, 135)" filter="url(#shadow)">
    <rect width="150" height="55" rx="6" fill="url(#engGrad)" stroke="#ea580c" stroke-width="1.5" />
    <text x="75" y="22" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Engineering</text>
    <text x="75" y="38" fill="#ffedd5" font-size="11" font-weight="600" text-anchor="middle">Manager</text>
  </g>

  <!-- Assembly Deputy Manager -->
  <g transform="translate(570, 135)" filter="url(#shadow)">
    <rect width="110" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="55" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Assembly</text>
    <text x="55" y="38" fill="#cbd5e1" font-size="10" text-anchor="middle">Deputy Manager</text>
  </g>

  <!-- Finance Deputy Manager -->
  <g transform="translate(690, 135)" filter="url(#shadow)">
    <rect width="110" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="55" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Finance</text>
    <text x="55" y="38" fill="#cbd5e1" font-size="10" text-anchor="middle">Deputy Manager</text>
  </g>

  <!-- MOIR & EHS HR Manager -->
  <g transform="translate(810, 135)" filter="url(#shadow)">
    <rect width="110" height="55" rx="6" fill="url(#deptGrad)" />
    <text x="55" y="20" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">MOIR &amp; EHS</text>
    <text x="55" y="38" fill="#cbd5e1" font-size="10" text-anchor="middle">HR Manager</text>
  </g>

  <!-- Support Functions -->
  <g transform="translate(930, 135)" filter="url(#shadow)">
    <rect width="160" height="55" rx="6" fill="#334155" />
    <text x="80" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Support Functions</text>
    <text x="80" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">HR • Procurement • IT • CS</text>
  </g>

  <!-- Engineering Department banner -->
  <g transform="translate(10, 215)" filter="url(#shadow)">
    <rect width="1080" height="30" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="540" y="19" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">Engineering Department — PFE / Internship Location</text>
  </g>

  <!-- Connecting lines from Engineering Manager to sub-departments -->
  <path d="M 485 190 L 485 260 M 150 260 L 820 260 M 150 260 L 150 280 M 485 260 L 485 280 M 820 260 L 820 280" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- NPI & Product Design Manager -->
  <g transform="translate(15, 280)">
    <rect width="270" height="55" rx="8" fill="url(#npiGrad)" filter="url(#shadow)" />
    <text x="135" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">NPI &amp; Product Design</text>
    <text x="135" y="40" fill="#bfdbfe" font-size="11" font-weight="600" text-anchor="middle">Manager</text>

    <line x1="135" y1="55" x2="135" y2="80" stroke="#93c5fd" stroke-width="2" />

    <!-- NPI Team box -->
    <rect x="5" y="80" width="260" height="230" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)" />
    <text x="135" y="103" fill="#1e3a8a" font-size="12" font-weight="bold" text-anchor="middle">NPI Team</text>

    <rect x="15" y="115" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="135" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Product Engineer</text>

    <rect x="15" y="155" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="175" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Product Technician</text>

    <rect x="15" y="195" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="215" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Prototype Responsible</text>

    <!-- Operation Project Engineer linked via dashed line -->
    <line x1="135" y1="230" x2="135" y2="260" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" />

    <rect x="15" y="260" width="240" height="42" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.2" filter="url(#shadow)" />
    <text x="135" y="280" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">Operation Project Engineer</text>
    <text x="135" y="295" fill="#1e40af" font-size="10.5" font-weight="500" text-anchor="middle">(× 2)</text>
  </g>

  <!-- Industrial Engineering & Tooling Coordinator -->
  <g transform="translate(350, 280)">
    <rect width="270" height="55" rx="8" fill="url(#toolGrad)" filter="url(#shadow)" />
    <text x="135" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Industrial Engineering &amp;</text>
    <text x="135" y="40" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">Tooling Coordinator</text>

    <line x1="135" y1="55" x2="135" y2="80" stroke="#6ee7b7" stroke-width="2" />

    <!-- Tooling Team box -->
    <rect x="5" y="80" width="260" height="230" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)" />
    <text x="135" y="103" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle">Tooling Team</text>

    <rect x="15" y="115" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="135" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">3D Printing Responsible</text>

    <rect x="15" y="155" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="175" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Assembly Board Responsible</text>

    <rect x="15" y="195" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="215" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Programming Responsible</text>
  </g>

  <!-- Process Engineering Coordinator -->
  <g transform="translate(685, 280)">
    <rect width="270" height="55" rx="8" fill="url(#procGrad)" filter="url(#shadow)" />
    <text x="135" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Process Engineering</text>
    <text x="135" y="40" fill="#ddd6fe" font-size="11" font-weight="600" text-anchor="middle">Coordinator</text>

    <line x1="135" y1="55" x2="135" y2="80" stroke="#c084fc" stroke-width="2" />

    <!-- Process Team box -->
    <rect x="5" y="80" width="260" height="230" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadow)" />
    <text x="135" y="103" fill="#5b21b6" font-size="12" font-weight="bold" text-anchor="middle">Process Team</text>

    <rect x="15" y="115" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="135" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Process Engineer (× 3)</text>

    <rect x="15" y="155" width="240" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="135" y="175" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">Quoting Responsible</text>
  </g>

  <!-- Legend / Footer -->
  <g transform="translate(15, 650)" filter="url(#shadow)">
    <rect width="1070" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />

    <rect x="15" y="13" width="16" height="12" rx="2" fill="url(#engGrad)" />
    <text x="40" y="23" fill="#334155" font-size="11" font-weight="600">Engineering Department — PFE / Internship Scope</text>

    <rect x="15" y="33" width="16" height="12" rx="2" fill="#475569" />
    <text x="40" y="43" fill="#475569" font-size="10.5" font-weight="500">Other ECI Tangier Departments (Quality, Operations &amp; Maintenance, Supply Chain, Assembly, Finance, MOIR &amp; EHS, Support Functions)</text>
  </g>
</svg>
